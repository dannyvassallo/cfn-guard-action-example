name: CloudFormation Guard Validate

on:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      # only required when create-review is true
      pull-requests: write
      # only required for workflows in private repositories
      contents: read
    name: CloudFormation Guard validate
    steps:
      - name: CloudFormation Guard validate
        uses: dannyvassallo/cloudformation-guard@action-test-v14
        with:
          rules: 'resources/validate/rules'
          data: 'resources/validate/data'
          debug: true
